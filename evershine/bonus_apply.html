<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>加給申請 - 永晴美學牙醫診所</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #5c6b73; --accent: #8ecae6; --success: #9dc88d;
            --danger: #ef9a9a; --bg: #f8f9fa; --gray: #b0bec5;
            --orange: #ffcc80; --teal: #80cbc4; --purple: #ce93d8;
        }
        * { box-sizing: border-box; }
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background: var(--bg); margin: 0;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; padding: 20px 0;
        }

        /* Loading */
        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.7); backdrop-filter: blur(2px);
            z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #f3f3f3;
            border-top: 5px solid var(--purple); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }

        .card {
            background: white; padding: 1.5rem; border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 95%; max-width: 420px;
        }

        /* Tab switcher */
        .tab-bar {
            display: grid; grid-template-columns: 1fr 1fr;
            background: #f5f5f5; border-radius: 14px; padding: 4px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px; border: none; border-radius: 11px; cursor: pointer;
            font-size: 0.88em; font-weight: bold; transition: 0.2s;
            color: #999; background: transparent;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }
        .tab-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .tab-btn i { margin-right: 5px; }

        /* Header */
        .page-header {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 20px; padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .back-btn {
            background: var(--bg); border: none; border-radius: 12px;
            width: 38px; height: 38px; cursor: pointer; font-size: 1em;
            color: var(--primary); display: flex; align-items: center; justify-content: center;
            transition: 0.2s; flex-shrink: 0;
        }
        .back-btn:active { transform: scale(0.92); background: #eee; }
        .page-title { font-size: 1.2em; font-weight: bold; color: var(--primary); margin: 0; }

        /* User bar */
        .user-bar {
            background: #fcfcfc; border-radius: 15px; padding: 12px 15px;
            margin-bottom: 20px; border: 1px solid #f5f5f5;
            display: flex; align-items: center; gap: 10px;
        }
        .user-bar i { color: var(--purple); font-size: 1.1em; }
        .user-bar-name { font-weight: bold; color: var(--primary); font-size: 1em; }
        .user-bar-text { font-size: 0.9em; color: #666; }

        /* Form */
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block; font-size: 0.82em; color: #888;
            margin-bottom: 6px; font-weight: 600; letter-spacing: 0.3px;
        }
        .form-label span { color: var(--danger); margin-left: 2px; }
        .form-control {
            width: 100%; padding: 12px 14px; font-size: 0.95em;
            border: 2px solid #eee; border-radius: 12px; background: white;
            transition: 0.3s; color: var(--primary); appearance: none;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }
        .form-control:focus { border-color: var(--purple); outline: none; }
        .form-control:disabled { background: #f5f7f8; color: #aaa; border-color: #eee; cursor: not-allowed; }

        /* Amount field */
        .amount-wrap { position: relative; }
        .amount-wrap .currency {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #aaa; font-size: 0.95em; pointer-events: none;
        }
        .amount-wrap .form-control { padding-left: 30px; }

        /* Submit */
        .submit-btn {
            width: 100%; padding: 16px; font-size: 1em; font-weight: bold;
            border: none; border-radius: 16px; cursor: pointer;
            background: var(--purple); color: #4a1560;
            box-shadow: 0 4px 12px rgba(206, 147, 216, 0.35);
            transition: 0.2s; margin-top: 8px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }
        .submit-btn:active { transform: scale(0.97); filter: brightness(0.95); }
        .submit-btn i { margin-right: 6px; }

        #msg { font-size: 0.88em; margin-top: 12px; text-align: center; min-height: 1.2em; font-weight: bold; }
        .msg-success { color: #4caf50; }
        .msg-error { color: var(--danger); }

        /* Result box */
        .result-box { text-align: center; padding: 20px 10px; }
        .result-icon { font-size: 3em; margin-bottom: 12px; }
        .result-title { font-size: 1.2em; font-weight: bold; color: var(--primary); margin-bottom: 8px; }
        .result-sub { color: #999; font-size: 0.88em; margin-bottom: 20px; }
        .result-detail {
            background: #f9f9f9; border-radius: 14px; padding: 14px;
            text-align: left; font-size: 0.88em; color: #555; margin-bottom: 20px;
        }
        .result-detail div { padding: 4px 0; display: flex; justify-content: space-between; }
        .result-detail span:last-child { font-weight: bold; color: var(--primary); }
        .btn-secondary {
            width: 100%; padding: 14px; font-size: 0.95em; font-weight: bold;
            border: none; border-radius: 14px; cursor: pointer; transition: 0.2s;
            background: #eceff1; color: #78909c; margin-top: 10px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }
        .btn-secondary:active { transform: scale(0.97); }

        /* History list (查詢頁) */
        #historyPage { display: none; }
        .history-empty { text-align:center; color:#bbb; padding:30px; font-size:0.9em; }
        .bonus-item {
            padding: 14px 0; border-bottom: 1px solid #f5f5f5;
            display: flex; align-items: flex-start; gap: 10px;
        }
        .bonus-item:last-child { border-bottom: none; }
        .bonus-badge {
            width: 8px; height: 8px; border-radius: 50%;
            margin-top: 6px; flex-shrink: 0;
        }
        .badge-pending { background: #f4a434; }
        .badge-approved { background: #4caf50; }
        .badge-rejected { background: #ef9a9a; }
        .bonus-info { flex: 1; }
        .bonus-type { font-weight: bold; color: var(--primary); font-size: 0.95em; }
        .bonus-meta { font-size: 0.8em; color: #aaa; margin-top: 2px; }
        .bonus-right { text-align: right; flex-shrink: 0; }
        .bonus-amount { font-weight: bold; color: var(--primary); font-size: 0.95em; }
        .bonus-status { font-size: 0.8em; margin-top: 2px; }
        .status-pending { color: #f4a434; }
        .status-approved { color: #4caf50; }
        .status-rejected { color: #e57373; }

        .load-history-btn {
            width: 100%; padding: 14px; font-size: 0.95em; font-weight: bold;
            border: 2px solid var(--purple); border-radius: 14px; cursor: pointer;
            background: white; color: var(--purple); transition: 0.2s;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            margin-bottom: 16px;
        }
        .load-history-btn:active { background: #f9f0fc; }
    </style>
</head>
<body>

    <div id="loadingOverlay" class="hidden">
        <div class="spinner"></div>
        <p style="margin-top:15px; color:var(--primary); font-weight:bold;">資料傳輸中...</p>
    </div>

    <div class="card">
        <!-- Header -->
        <div class="page-header">
            <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-chevron-left"></i></button>
            <h2 class="page-title"><i class="fa-solid fa-coins" style="color:var(--purple); margin-right:6px;"></i>加給申請</h2>
        </div>

        <!-- User bar -->
        <div class="user-bar">
            <i class="fa-solid fa-circle-user"></i>
            <div>
                <div class="user-bar-name" id="displayName">載入中...</div>
                <div class="user-bar-text">工號：<span id="displayId">—</span></div>
            </div>
        </div>

        <!-- Tab bar -->
        <div class="tab-bar">
            <button class="tab-btn active" id="tabApply" onclick="switchTab('apply')">
                <i class="fa-solid fa-file-pen"></i>申請
            </button>
            <button class="tab-btn" id="tabHistory" onclick="switchTab('history')">
                <i class="fa-solid fa-clock-rotate-left"></i>查詢紀錄
            </button>
        </div>

        <!-- 申請頁 -->
        <div id="applyPage">
            <div id="formArea">
                <!-- 日期 -->
                <div class="form-group">
                    <label class="form-label">申請日期 <span>*</span></label>
                    <input type="date" id="bonusDate" class="form-control">
                </div>

                <!-- 項目 -->
                <div class="form-group">
                    <label class="form-label">加給項目 <span>*</span></label>
                    <input type="text" id="bonusType" class="form-control" placeholder="例如：加班費、績效獎金、交通補助...">
                </div>

                <!-- 原因 -->
                <div class="form-group">
                    <label class="form-label">申請原因 <span>*</span></label>
                    <textarea id="bonusReason" class="form-control" rows="3" style="resize:none;" placeholder="請說明申請加給的原因或事由"></textarea>
                </div>

                <!-- 金額 -->
                <div class="form-group">
                    <label class="form-label">申請金額（元） <span>*</span></label>
                    <div class="amount-wrap">
                        <span class="currency">$</span>
                        <input type="number" id="bonusAmount" class="form-control" placeholder="0" min="0" step="1">
                    </div>
                </div>

                <button class="submit-btn" onclick="submitBonus()">
                    <i class="fa-solid fa-paper-plane"></i>送出加給申請
                </button>
                <p id="msg"></p>
            </div>

            <!-- 送出成功畫面 -->
            <div id="resultArea" class="hidden result-box">
                <div class="result-icon">✅</div>
                <div class="result-title">申請已送出！</div>
                <div class="result-sub">主管審核後將更新狀態</div>
                <div class="result-detail" id="resultDetail"></div>
                <button class="submit-btn" onclick="resetForm()">
                    <i class="fa-solid fa-plus"></i>再次申請
                </button>
                <button class="btn-secondary" onclick="goBack()">
                    <i class="fa-solid fa-chevron-left"></i> 返回主選單
                </button>
            </div>
        </div>

        <!-- 查詢紀錄頁 -->
        <div id="historyPage">
            <button class="load-history-btn" onclick="loadHistory()">
                <i class="fa-solid fa-rotate-right"></i> 載入我的申請紀錄
            </button>
            <div id="historyList">
                <div class="history-empty">點擊上方按鈕載入紀錄</div>
            </div>
        </div>
    </div>

<script>
    let currentUser = { empId: '', name: '' };

    function initUser() {
        const params = new URLSearchParams(window.location.search);
        currentUser.empId = params.get('empId') || '';
        currentUser.name  = decodeURIComponent(params.get('name') || '');

        if (!currentUser.empId) {
            const saved = sessionStorage.getItem('clinicUser');
            if (saved) {
                const u = JSON.parse(saved);
                currentUser.empId = u.empId || '';
                currentUser.name  = u.name  || '';
            }
        }

        if (!currentUser.empId) {
            alert('請先登入系統');
            window.location.href = 'index.html';
            return;
        }

        $('#displayName').text(currentUser.name);
        $('#displayId').text(currentUser.empId);

        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        $('#bonusDate').val(`${yyyy}-${mm}-${dd}`);

        // 若從「加給查詢」按鈕進入，直接切到查詢頁並自動載入
        if (params.get('tab') === 'history') {
            switchTab('history');
            loadHistory();
        }
    }

    // 將 input[type=date] 的 yyyy-MM-dd 轉為 yyyy/M/d 顯示格式
    function formatDateDisplay(isoStr) {
        if (!isoStr) return '';
        const [y, m, d] = isoStr.split('-');
        return `${y}/${parseInt(m)}/${parseInt(d)}`;
    }

    function switchTab(tab) {
        if (tab === 'apply') {
            $('#applyPage').show();
            $('#historyPage').hide();
            $('#tabApply').addClass('active');
            $('#tabHistory').removeClass('active');
        } else {
            $('#applyPage').hide();
            $('#historyPage').show();
            $('#tabApply').removeClass('active');
            $('#tabHistory').addClass('active');
        }
    }

    function toggleLoading(show) {
        if (show) $('#loadingOverlay').removeClass('hidden');
        else $('#loadingOverlay').addClass('hidden');
    }

    function showMsg(text, type) {
        $('#msg').text(text).attr('class', type === 'error' ? 'msg-error' : 'msg-success');
    }

    async function submitBonus() {
        const dateRaw = $('#bonusDate').val();
        const type   = $('#bonusType').val().trim();
        const reason = $('#bonusReason').val().trim();
        const amount = $('#bonusAmount').val();

        if (!dateRaw) { showMsg('❌ 請選擇申請日期', 'error'); return; }
        if (!type)    { showMsg('❌ 請填寫加給項目', 'error'); return; }
        if (!reason)  { showMsg('❌ 請填寫申請原因', 'error'); return; }
        if (!amount || Number(amount) <= 0) { showMsg('❌ 請填寫有效金額', 'error'); return; }

        const dateDisplay = formatDateDisplay(dateRaw);

        toggleLoading(true);
        try {
            const payload = {
                action: 'submitBonus',
                empId: currentUser.empId,
                name: currentUser.name,
                date: dateDisplay, type, reason,
                amount: Number(amount)
            };
            const resp = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            const res = await resp.json();
            if (res.status === 'success') {
                showResult(dateDisplay, type, reason, amount);
            } else {
                showMsg('❌ ' + (res.message || '送出失敗，請稍後再試'), 'error');
            }
        } catch (e) {
            showMsg('❌ 連線失敗，請確認網路', 'error');
        } finally {
            toggleLoading(false);
        }
    }

    function showResult(date, type, reason, amount) {
        $('#formArea').addClass('hidden');
        const detail = `
            <div><span>姓名</span><span>${currentUser.name}</span></div>
            <div><span>工號</span><span>${currentUser.empId}</span></div>
            <div><span>日期</span><span>${date}</span></div>
            <div><span>項目</span><span>${type}</span></div>
            <div><span>原因</span><span>${reason}</span></div>
            <div><span>金額</span><span>$${Number(amount).toLocaleString()}</span></div>
            <div><span>狀態</span><span style="color:#a855c7;">待審核</span></div>
        `;
        $('#resultDetail').html(detail);
        $('#resultArea').removeClass('hidden');
    }

    function resetForm() {
        $('#resultArea').addClass('hidden');
        $('#formArea').removeClass('hidden');
        $('#bonusType, #bonusReason, #bonusAmount').val('');
        showMsg('', '');
        // 重設日期為今天
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        $('#bonusDate').val(`${yyyy}-${mm}-${dd}`);
    }

    async function loadHistory() {
        toggleLoading(true);
        try {
            const resp = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'getBonusRecords', empId: currentUser.empId })
            });
            const res = await resp.json();
            const listArea = $('#historyList').empty();

            if (res.status === 'success' && res.data.length > 0) {
                res.data.forEach(item => {
                    const statusClass = item.status === '核准' ? 'status-approved'
                                      : item.status === '退回' ? 'status-rejected'
                                      : 'status-pending';
                    const badgeClass  = item.status === '核准' ? 'badge-approved'
                                      : item.status === '退回' ? 'badge-rejected'
                                      : 'badge-pending';
                    listArea.append(`
                        <div class="bonus-item">
                            <div class="bonus-badge ${badgeClass}"></div>
                            <div class="bonus-info">
                                <div class="bonus-type">${item.type}</div>
                                <div class="bonus-meta">${item.date} ・ ${item.reason}</div>
                            </div>
                            <div class="bonus-right">
                                <div class="bonus-amount">$${Number(item.amount).toLocaleString()}</div>
                                <div class="bonus-status ${statusClass}">${item.status}</div>
                            </div>
                        </div>
                    `);
                });
            } else {
                listArea.html('<div class="history-empty">目前尚無申請紀錄</div>');
            }
        } catch (e) {
            $('#historyList').html('<div class="history-empty" style="color:var(--danger)">載入失敗，請稍後再試</div>');
        } finally {
            toggleLoading(false);
        }
    }

    function goBack() {
        window.location.href = 'index.html';
    }

    $(document).ready(function() {
        initUser();
    });
</script>
</body>
</html>
