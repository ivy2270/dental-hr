<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醫師助理出診摘要 - 微風牙醫</title>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --teal: #2c7a7b;
            --teal-light: #e6fffa;
            --teal-mid: #81e6d9;
            --primary: #5c6b73;
            --accent: #8ecae6;
            --bg: #f0f4f8;
            --white: #ffffff;
            --border: #e2e8f0;
            --text: #2d3748;
            --muted: #718096;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* ── Header ── */
        .page-header {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .back-btn {
            background: #f7fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 14px;
            font-size: 13px;
            cursor: pointer;
            color: var(--primary);
            font-weight: bold;
            transition: 0.2s;
        }
        .back-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
        .header-title { flex: 1; }
        .header-title h1 { font-size: 17px; color: var(--teal); font-weight: 700; }
        .header-title small { font-size: 12px; color: var(--muted); }
        .header-controls { display: flex; align-items: center; gap: 10px; }
        .header-controls label { font-size: 13px; color: var(--muted); white-space: nowrap; }
        input[type="month"] {
            padding: 7px 10px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 14px; background: #f7fafc; cursor: pointer;
        }
        input[type="month"]:focus { outline: none; border-color: var(--accent); }
        .btn-query {
            padding: 8px 18px; background: var(--teal); color: white;
            border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-query:hover { opacity: 0.85; }
        .btn-query:disabled { background: #b2d8d8; cursor: not-allowed; }

        /* ── Main ── */
        .main { padding: 24px; max-width: 860px; margin: 0 auto; }

        /* ── Placeholder states ── */
        .placeholder { text-align: center; padding: 80px 20px; color: var(--muted); }
        .placeholder i { font-size: 44px; color: #cbd5e0; display: block; margin-bottom: 14px; }
        .placeholder .p-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
        .placeholder .p-sub { font-size: 13px; }
        .spinner {
            width: 38px; height: 38px; border: 4px solid #e2e8f0;
            border-top-color: var(--teal); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Cards ── */
        #cardsArea { display: flex; flex-direction: column; gap: 20px; }

        .dr-card {
            background: var(--white);
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            overflow: hidden;
        }
        .card-head {
            background: linear-gradient(135deg, var(--teal) 0%, #285e61 100%);
            color: white;
            padding: 15px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-head h2 { font-size: 17px; font-weight: 700; }
        .total-pill {
            background: rgba(255,255,255,0.22);
            padding: 4px 13px; border-radius: 20px;
            font-size: 13px; font-weight: 700;
        }

        /* 統計列 */
        .stat-row { display: flex; border-bottom: 1px solid var(--border); }
        .stat-cell {
            flex: 1; padding: 11px 12px; text-align: center;
            border-right: 1px solid var(--border);
        }
        .stat-cell:last-child { border-right: none; }
        .stat-val { font-size: 21px; font-weight: 700; color: var(--teal); }
        .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

        /* 助理列表 */
        .asst-list { padding: 6px 16px 12px; }
        .list-head {
            display: grid;
            grid-template-columns: 1fr 80px 1fr;
            gap: 10px;
            padding: 6px 10px;
            font-size: 11px; font-weight: 700; color: var(--muted);
            letter-spacing: 0.05em;
            border-bottom: 2px solid var(--border);
            margin-bottom: 2px;
        }
        .asst-row {
            display: grid;
            grid-template-columns: 1fr 80px 1fr;
            gap: 10px;
            padding: 9px 10px;
            align-items: center;
            border-radius: 7px;
            transition: background 0.12s;
        }
        .asst-row:hover { background: #f7fafc; }
        .asst-row + .asst-row { border-top: 1px solid #f0f4f8; }
        .asst-name { font-weight: 600; font-size: 14px; }
        .asst-shifts { text-align: center; }
        .shift-badge {
            display: inline-block;
            background: var(--teal-light); color: var(--teal);
            font-size: 14px; font-weight: 700;
            padding: 3px 12px; border-radius: 20px;
            border: 1.5px solid var(--teal-mid);
        }
        .breakdown { display: flex; gap: 4px; flex-wrap: wrap; }
        .stag { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
        .stag-m { background: #ebf8ff; color: #2b6cb0; }
        .stag-a { background: #f0fff4; color: #276749; }
        .stag-e { background: #fffaf0; color: #975a16; }

        .card-foot {
            border-top: 1px solid var(--border);
            padding: 7px 18px;
            font-size: 11px; color: #a0aec0; font-style: italic;
        }
    </style>
</head>
<body>

<div class="page-header">
    <button class="back-btn" onclick="goBack()">
        <i class="fa-solid fa-arrow-left"></i> 返回
    </button>
    <div class="header-title">
        <h1><i class="fa-solid fa-stethoscope" style="margin-right:7px;"></i>醫師助理出診摘要</h1>
        <small id="adminName"></small>
    </div>
    <div class="header-controls">
        <label>月份</label>
        <input type="month" id="monthPicker">
        <button class="btn-query" id="btnQuery" onclick="loadReport()">
            <i class="fa-solid fa-magnifying-glass"></i> 查詢
        </button>
    </div>
</div>

<div class="main">

    <div id="stEmpty" class="placeholder">
        <i class="fa-solid fa-calendar-check"></i>
        <div class="p-title">選擇月份後按查詢</div>
        <div class="p-sub">系統將從班表撈取每位醫師的助理出診統計</div>
    </div>

    <div id="stLoading" class="placeholder" style="display:none;">
        <div class="spinner"></div>
        <div class="p-title">讀取班表資料中...</div>
    </div>

    <div id="stNoData" class="placeholder" style="display:none;">
        <i class="fa-solid fa-inbox"></i>
        <div class="p-title">該月尚無班表資料</div>
        <div class="p-sub">請確認班表是否已發布</div>
    </div>

    <div id="cardsArea" style="display:none;"></div>

</div>

<script>
    let currentUser = null;

    window.onload = function() {
        const p = new URLSearchParams(window.location.search);
        const empId = p.get('empId'), name = p.get('name'), role = p.get('role');
        if (!empId || (role !== "主管" && role !== "Admin")) {
            alert("權限不足，將返回主選單");
            window.location.href = "index.html";
            return;
        }
        currentUser = { empId, name, role };
        document.getElementById('adminName').textContent = `主管：${name}`;

        const now = new Date();
        document.getElementById('monthPicker').value =
            now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
    };

    function goBack() { window.location.href = "index.html"; }

    async function loadReport() {
        const yearMonth = document.getElementById('monthPicker').value;
        if (!yearMonth) { alert("請選擇月份"); return; }

        setState('loading');
        document.getElementById('btnQuery').disabled = true;

        try {
            const res = await fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify({ action: "getDrBonusSummary", yearMonth })
            });
            const result = await res.json();
            if (result.status !== "success") {
                alert("讀取失敗：" + result.message);
                setState('empty');
                return;
            }
            const data = result.data;
            if (!data || Object.keys(data).length === 0) { setState('noData'); return; }
            renderCards(data, yearMonth);
            setState('cards');
        } catch(e) {
            alert("連線失敗：" + e.message);
            setState('empty');
        } finally {
            document.getElementById('btnQuery').disabled = false;
        }
    }

    function renderCards(data, yearMonth) {
        const [y, m] = yearMonth.split("-");
        const monthLabel = `${y} 年 ${parseInt(m)} 月`;

        document.getElementById('cardsArea').innerHTML = Object.keys(data).sort().map(drName => {
            const dr = data[drName];
            const sorted = [...dr.assistants].sort((a, b) => b.shifts - a.shifts);
            let totShifts = 0, totM = 0, totA = 0, totE = 0;
            sorted.forEach(a => { totShifts += a.shifts; totM += a.morning; totA += a.afternoon; totE += a.evening; });

            const rows = sorted.map(a => {
                const parts = [];
                if (a.morning)   parts.push(`<span class="stag stag-m">早 ${a.morning}</span>`);
                if (a.afternoon) parts.push(`<span class="stag stag-a">午 ${a.afternoon}</span>`);
                if (a.evening)   parts.push(`<span class="stag stag-e">晚 ${a.evening}</span>`);
                return `<div class="asst-row">
                    <span class="asst-name">${esc(a.name)}</span>
                    <span class="asst-shifts"><span class="shift-badge">${a.shifts} 診</span></span>
                    <span class="breakdown">${parts.join('')}</span>
                </div>`;
            }).join('');

            return `<div class="dr-card">
                <div class="card-head">
                    <h2>Dr. ${esc(drName)}</h2>
                    <span class="total-pill">${monthLabel}・共 ${totShifts} 診</span>
                </div>
                <div class="stat-row">
                    <div class="stat-cell"><div class="stat-val">${dr.assistants.length}</div><div class="stat-lbl">助理人數</div></div>
                    <div class="stat-cell"><div class="stat-val">${totShifts}</div><div class="stat-lbl">總診數</div></div>
                    <div class="stat-cell"><div class="stat-val">${totM}</div><div class="stat-lbl">早診</div></div>
                    <div class="stat-cell"><div class="stat-val">${totA}</div><div class="stat-lbl">午診</div></div>
                    <div class="stat-cell"><div class="stat-val">${totE}</div><div class="stat-lbl">晚診</div></div>
                </div>
                <div class="asst-list">
                    <div class="list-head">
                        <span>助理姓名</span>
                        <span style="text-align:center;">跟診診數</span>
                        <span>診別明細</span>
                    </div>
                    ${rows}
                </div>
                <div class="card-foot">* 依班表及打卡記錄統計</div>
            </div>`;
        }).join('');
    }

    function setState(s) {
        document.getElementById('stEmpty').style.display    = s === 'empty'   ? 'block' : 'none';
        document.getElementById('stLoading').style.display  = s === 'loading'  ? 'block' : 'none';
        document.getElementById('stNoData').style.display   = s === 'noData'  ? 'block' : 'none';
        document.getElementById('cardsArea').style.display  = s === 'cards'   ? 'flex'  : 'none';
    }

    function esc(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
</script>
</body>
</html>
